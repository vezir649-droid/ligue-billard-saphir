plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saphir.sms'
    compileSdk 34

    defaultConfig {
        applicationId "com.saphir.sms"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
    }

    signingConfigs {
        release {
            storeFile file('../saphir.keystore')
            storePassword 'saphir123'
            keyAlias 'saphir'
            keyPassword 'saphir123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
