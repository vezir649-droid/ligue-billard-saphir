plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saphir.sms'
    compileSdk 34

    defaultConfig {
        applicationId "com.saphir.sms"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.0.6"

        def envSupabaseKey = System.getenv("SUPABASE_KEY") ?: ""
        buildConfigField "String", "DEFAULT_SUPABASE_KEY", "\"${envSupabaseKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('../saphir.keystore')
            storePassword 'saphir123'
            keyAlias 'saphir'
            keyPassword 'saphir123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
