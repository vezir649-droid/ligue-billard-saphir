name: Compiler SaphirSMS APK
on:
  push:
    paths:
      - 'android-saphir-sms/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
concurrency:
  group: build-saphir-sms-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Compilation de l'APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v7
      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Configuration de Gradle 8.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'
          cache-disabled: true
      - name: Configuration du SDK Android
        working-directory: android-saphir-sms
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Compilation de l'application (Release APK)
        working-directory: android-saphir-sms
        run: |
          gradle assembleRelease --stacktrace
      - name: Préparer l'APK
        run: |
          mkdir -p build-output
          cp android-saphir-sms/app/build/outputs/apk/release/*.apk build-output/SaphirSMS.apk
      - name: Téléverser l'APK téléchargeable
        uses: actions/upload-artifact@v7
        with:
          name: SaphirSMS-APK
          path: build-output/SaphirSMS.apk
